name: CI

on:
  push:
    branches:
      # NB: Fork-only, must be dropped before the upstream PR is cut: run CI on this branch's
      #     pushes (and manually) so the visionOS enablement is validated pre-PR. Upstream
      #     triggers on main pushes and PRs only.
      - "**"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  # NB: Fork-only validation job, must be dropped before the upstream PR is cut (upstream asked
  #     for compiler directives only in pointfreeco/swift-snapshot-testing#855). It proves the
  #     library and test bundle compile and run for visionOS; no visionOS-specific tests exist
  #     on this branch, so most suites are compile-only here.
  visionos:
    strategy:
      matrix:
        xcode:
          - '16.4'

    name: visionOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      # NB: xcodebuild does not forward the job environment to the test process, so the suite's
      #     GITHUB_WORKFLOW guard (which upstream relies on to skip device-scale-dependent
      #     image asserts on CI) never fires on its own; TEST_RUNNER_GITHUB_WORKFLOW delivers
      #     it the way upstream intends.
      - name: Run tests
        run: |
          set -o pipefail && \
          TEST_RUNNER_GITHUB_WORKFLOW=CI xcodebuild test \
            -scheme swift-snapshot-testing-Package \
            -destination platform="visionOS Simulator,name=Apple Vision Pro (at 2732x2048),OS=2.5"

  macos:
    strategy:
      matrix:
        xcode:
          - '16.4'

    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run tests
        run: make test-swift

  ubuntu:
    strategy:
      matrix:
        swift:
          - '6.1'

    container: swift:${{ matrix.swift }}
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  android:
    strategy:
      matrix:
        swift:
          - "6.2"
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: ${{ matrix.swift }}
          copy-files: ${GITHUB_WORKSPACE}/Tests/SnapshotTestingTests/__Snapshots__
          # NB: Fork-only while validating this branch (upstream main is broken the same way):
          #     AssertSnapshot.swift hardcodes this path for os(Android); the action's default
          #     changed to swift-android-tests in v2.9.5. Upstream-relevant fix on its own.
          android-emulator-test-folder: /data/local/tmp/android-xctest

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  macos:
    strategy:
      matrix:
        xcode:
          - '16.4'

    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run tests
        run: make test-swift

  ios:
    strategy:
      matrix:
        xcode:
          - '27.0'

    name: iOS
    # The macOS 27 image, in public preview. Its only iOS runtime is iOS 27.0.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run image tests
        # Only tests that record their references at runtime; the rest compare against references
        # recorded on other simulators.
        run: |
          xcodebuild test \
            -scheme swift-snapshot-testing-Package \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -only-testing:SnapshotTestingTests/ImagePixelFormatTests \
            -only-testing:SnapshotTestingTests/ImagePixelFormatConfigurationTests \
            -only-testing:SnapshotTestingTests/PerceptualColorManagementTests \
            -only-testing:SnapshotTestingTests/ColorSpaceComparisonTests \
            -only-testing:SnapshotTestingTests/DifferenceImageLayoutTests \
            -only-testing:SnapshotTestingTests/ImageDataErrorTests

  ubuntu:
    strategy:
      matrix:
        swift:
          - '6.1'

    container: swift:${{ matrix.swift }}
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  android:
    strategy:
      matrix:
        swift:
          - "6.2"
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: ${{ matrix.swift }}
          copy-files: ${GITHUB_WORKSPACE}/Tests/SnapshotTestingTests/__Snapshots__
          # AssertSnapshot.swift reads references from this folder on Android; the action's
          # default is now /data/local/tmp/swift-android-tests.
          android-emulator-test-folder: /data/local/tmp/android-xctest
